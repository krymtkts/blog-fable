name: "Build pages Action"
description: "Setup .NET and Node.js, install dependencies and build pages."

runs:
  using: "composite"
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: ./global.json
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: ./package.json
    - name: Install dependencies
      shell: bash
      run: npm install
    - name: Audit npm dependencies
      shell: bash
      run: npm audit --include=dev --audit-level=low
    - name: Build pages
      shell: bash
      run: npm run build
    - name: Check formatting
      shell: bash
      run: dotnet fantomas check ./src ./test ./RunDevServer.fsx
    - name: Install Playwright
      shell: pwsh
      run: |
        dotnet build ./test/test.fsproj
        ./test/bin/Debug/*/playwright.ps1 install-deps
        ./test/bin/Debug/*/playwright.ps1 install
    - name: Snapshot tests
      shell: bash
      # NOTE: Simplify test command to prevent no zero tests ran in MTP v2.
      run: dotnet test
